includes:
  - deploy: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/deploy.yaml

tasks:
  - name: all
    actions:
      - task: restart-metallb-speaker
      - task: deploy-uds-core-identity-authorization
      - task: deploy-passthrough-test
      - task: test-metallb-lb

  - name: restart-metallb-speaker
    description: Restart the MetalLB speaker to ensure the exemption is applied
    actions:
      - cmd: |
          ./uds zarf tools kubectl rollout restart daemonset/metallb-speaker -n metallb-system
      - wait:
          cluster:
            kind: daemonset
            name: metallb-speaker
            namespace: metallb-system
            condition: "'{.status.numberReady}'=1"

  - name: deploy-uds-core-identity-authorization
    description: Deploy UDS Core Identity and Authorization so we have an endpoint to test MetalLB
    actions:
      - cmd: |
          # renovate: datasource=docker depName=ghcr.io/defenseunicorns/packages/uds/core-identity-authorization versioning=docker
          ./uds zarf package deploy oci://ghcr.io/defenseunicorns/packages/uds/core-identity-authorization:1.17.2-upstream \
            --certificate-identity-regexp '^https://github\.com/defenseunicorns/uds-core/\.github/workflows/publish\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --confirm

  - name: deploy-passthrough-test
    description: Build and deploy the local passthrough-test package (backend behind the passthrough gateway)
    actions:
      - cmd: |
          ./uds zarf package create tests/passthrough --skip-sbom --confirm -o tests/passthrough
          ./uds zarf package deploy "tests/passthrough/zarf-package-passthrough-test-${UDS_ARCH}-dev.tar.zst" --confirm

  - name: test-metallb-lb
    description: Validate each MetalLB pool is allocating + L2-advertising
    actions:
      - description: Verify the Keycloak public endpoint through the tenant gateway
        cmd: bash tests/check-gateway.sh istio-tenant-gateway tenant-ingressgateway sso.uds.dev "My Account"
      - description: Verify the Keycloak admin endpoint through the admin gateway
        cmd: bash tests/check-gateway.sh istio-admin-gateway admin-ingressgateway keycloak.admin.uds.dev "Welcome to Keycloak"
      - description: Verify the test endpoint through the passthrough gateway
        cmd: bash tests/check-gateway.sh istio-passthrough-gateway passthrough-ingressgateway passthrough.uds.dev "passthrough ok"
